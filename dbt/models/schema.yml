version: 2

sources:
  - name: enterprise_intelligence_platform
    database: ENTERPRISE_INTELLIGENCE_PLATFORM
    schema: RAW
    tables:
      - name: property_raw
      - name: payment_fact
      - name: sales_pipeline_raw

models:
  - name: stg_properties
    description: Standardised property source records for portfolio analytics.
    columns:
      - name: property_id
        tests:
          - unique
          - not_null
      - name: organisation_id
        tests:
          - not_null
      - name: occupancy_rate
        tests:
          - not_null

  - name: stg_sales_pipeline
    description: Standardised sales opportunity records for pipeline analytics.
    columns:
      - name: opportunity_id
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: opportunity_value
        tests:
          - not_null

  - name: mart_portfolio_kpis
    description: Portfolio-level KPI rollups for occupancy, arrears and rental performance.
    columns:
      - name: property_id
        tests:
          - not_null
      - name: total_arrears
        tests:
          - not_null

  - name: mart_sales_pipeline_kpis
    description: Sales pipeline rollups by region and stage with weighted probability.
    columns:
      - name: region_name
        tests:
          - not_null
      - name: stage_name
        tests:
          - not_null
      - name: pipeline_value
        tests:
          - not_null
